<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sopy" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>Sopy</title>
</head>
<body data-mobile-tab="player">
  <!-- Динамический размытый фон -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <img id="ambient-img" class="ambient-img hidden" alt="" />
  </div>

  <div class="app-layout">
    <!-- Левая панель: Медиатека -->
    <aside class="sidebar glass-panel" data-panel="library">
      <div class="panel-header">
        <span>Медиатека</span>
        <div class="header-right">
          <span id="track-count" class="badge">0</span>
          <button id="mobile-add-btn" class="mini-add-btn" aria-label="Добавить">+</button>
        </div>
      </div>

      <!-- Поиск и фильтр Избранного -->
      <div class="library-tools">
        <input id="search-input" type="search" class="search-input" placeholder="Поиск треков и исполнителей..." />
        <div class="filter-pills">
          <button id="filter-all" class="pill-btn active">Все</button>
          <button id="filter-fav" class="pill-btn">♥ Избранное</button>
        </div>
      </div>

      <div id="track-list" class="track-list">
        <div class="empty-list">Нет треков</div>
      </div>
    </aside>

    <!-- Центр: Плеер + Визуализатор -->
    <main class="main-player glass-panel" data-panel="player">
      <button id="open-modal-btn" class="add-circle-btn glass-btn" aria-label="Добавить песню">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <div class="player-content">
        <!-- Большая обложка -->
        <div class="cover-wrapper">
          <div class="cover-box" id="cover-box">
            <img id="cover-img" class="hidden" alt="Обложка" />
            <div id="cover-placeholder" class="cover-placeholder">
              <svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor" opacity="0.45">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Название трека, исполнитель и Избранное -->
        <div class="title-row">
          <div class="title-block">
            <div id="current-title" class="song-title">Выберите трек</div>
            <div id="current-artist" class="song-subtitle hidden"></div>
          </div>
          <button id="current-fav-btn" class="fav-btn" aria-label="В избранное">♡</button>
        </div>

        <!-- Музыкальный визуализатор -->
        <canvas id="visualizer" width="320" height="44"></canvas>

        <!-- Полоса перемотки -->
        <div class="seek-block">
          <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" />
          <div class="time-row">
            <span id="current-time">00:00</span>
            <span id="duration">00:00</span>
          </div>
        </div>

        <!-- Управление -->
        <div class="controls">
          <button id="prev-btn" class="nav-btn" aria-label="Предыдущий">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <button id="skip-back-btn" class="nav-btn" aria-label="Назад на 10 секунд">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5a7 7 0 1 1-6.32 4"/>
              <polyline points="8 5 12 5 12 9"/>
              <text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none">10</text>
            </svg>
          </button>

          <button id="play-btn" class="play-pause-btn glass-btn" aria-label="Пуск/Пауза">
            <svg id="icon-play" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path d="M8 5.14v14l11-7-11-7z"/>
            </svg>
            <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <rect x="6" y="5" width="4.2" height="14" rx="1.5"/>
              <rect x="13.8" y="5" width="4.2" height="14" rx="1.5"/>
            </svg>
          </button>

          <button id="skip-forward-btn" class="nav-btn" aria-label="Вперёд на 10 секунд">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5a7 7 0 1 0 6.32 4"/>
              <polyline points="16 5 12 5 12 9"/>
              <text x="12" y="15.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none">10</text>
            </svg>
          </button>

          <button id="next-btn" class="nav-btn" aria-label="Следующий">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>
        </div>

        <!-- Режимы: Перемешать и Повтор трека -->
        <div class="mode-controls">
          <button id="shuffle-btn" class="mode-btn" aria-label="Перемешать" title="Перемешать">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 3 21 3 21 8"></polyline>
              <line x1="4" y1="20" x2="21" y2="3"></line>
              <polyline points="21 16 21 21 16 21"></polyline>
              <line x1="15" y1="15" x2="21" y2="21"></line>
              <line x1="4" y1="4" x2="9" y2="9"></line>
            </svg>
            <span>Перемешать</span>
          </button>

          <button id="repeat-btn" class="mode-btn" aria-label="Повтор трека" title="Повтор трека">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"></polyline>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
              <polyline points="7 23 3 19 7 15"></polyline>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            </svg>
            <span id="repeat-label">Повтор</span>
          </button>
        </div>

        <!-- Регулятор громкости -->
        <div class="volume-block">
          <button id="mute-btn" class="vol-icon-btn" aria-label="Выключить звук">
            <svg id="icon-vol" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg id="icon-mute" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" />
          <span id="volume-pct" class="vol-pct">100%</span>
        </div>
      </div>
    </main>

    <!-- Правая панель: Очередь / Текст / Звук -->
    <aside class="right-panel glass-panel" data-panel="extra">
      <div class="tab-switcher">
        <button id="tab-queue" class="tab-btn active">Очередь</button>
        <button id="tab-lyrics" class="tab-btn">Текст</button>
        <button id="tab-sound" class="tab-btn">Звук</button>
      </div>

      <!-- Очередь -->
      <div id="queue-view" class="panel-body">
        <div class="queue-hint">Перетаскивайте треки для изменения порядка</div>
        <div id="queue-list" class="queue-list"></div>
      </div>

      <!-- Текст песни -->
      <div id="lyrics-view" class="panel-body hidden">
        <div id="lyrics-content" class="lyrics-content">
          <div class="empty-list">Текст не добавлен. Нажмите ✎ на треке, чтобы вставить текст.</div>
        </div>
      </div>

      <!-- Звук: Эквалайзер и Таймер сна -->
      <div id="sound-view" class="panel-body hidden">
        <div id="eq-section" class="sound-section">
          <div class="section-title">Эквалайзер</div>
          <div class="eq-presets">
            <button class="preset-btn active" data-preset="flat">Ровный</button>
            <button class="preset-btn" data-preset="bass">Bass Boost</button>
            <button class="preset-btn" data-preset="pop">Pop</button>
            <button class="preset-btn" data-preset="rock">Rock</button>
            <button class="preset-btn" data-preset="vocal">Вокал</button>
          </div>

          <div class="eq-sliders">
            <div class="eq-row">
              <div class="eq-label"><span>Бас</span><span id="eq-bass-val">0 дБ</span></div>
              <input type="range" id="eq-bass" class="eq-range" min="-12" max="12" step="1" value="0" />
            </div>
            <div class="eq-row">
              <div class="eq-label"><span>Середина</span><span id="eq-mid-val">0 дБ</span></div>
              <input type="range" id="eq-mid" class="eq-range" min="-12" max="12" step="1" value="0" />
            </div>
            <div class="eq-row">
              <div class="eq-label"><span>Верх</span><span id="eq-treble-val">0 дБ</span></div>
              <input type="range" id="eq-treble" class="eq-range" min="-12" max="12" step="1" value="0" />
            </div>
          </div>
        </div>

        <div class="sound-section">
          <div class="section-title">Таймер сна</div>
          <div id="sleep-status" class="sleep-status">Выключен</div>
          <div class="sleep-grid">
            <button class="sleep-btn active" data-min="0">Выкл</button>
            <button class="sleep-btn" data-min="15">15 мин</button>
            <button class="sleep-btn" data-min="30">30 мин</button>
            <button class="sleep-btn" data-min="45">45 мин</button>
            <button class="sleep-btn" data-min="60">60 мин</button>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Мини-плеер для мобильной версии -->
  <div id="mini-player" class="mini-player glass-panel hidden">
    <div id="mini-thumb" class="track-thumb">♪</div>
    <div id="mini-title" class="mini-title">Выберите трек</div>
    <button id="mini-play-btn" class="mini-play-btn" aria-label="Пуск/Пауза">▶</button>
  </div>

  <!-- Нижняя навигация для iPhone -->
  <nav id="mobile-nav" class="mobile-nav glass-panel">
    <button class="mobile-tab" data-target="library">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/>
      </svg>
      <span>Медиатека</span>
    </button>
    <button class="mobile-tab active" data-target="player">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <span>Плеер</span>
    </button>
    <button class="mobile-tab" data-target="extra">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
      </svg>
      <span>Ещё</span>
    </button>
  </nav>

  <!-- Модальное окно добавления / редактирования -->
  <div id="add-modal" class="modal hidden">
    <div class="modal-box glass-panel">
      <h2 id="modal-title">Новый трек</h2>

      <label id="audio-picker-wrap" class="file-picker-btn">
        <span id="audio-label">Выбрать аудиофайл</span>
        <input id="audio-input" type="file" accept="audio/*,.mp3,.m4a,.wav,.flac" hidden />
      </label>

      <label class="file-picker-btn">
        <span id="image-label">Выбрать обложку из галереи</span>
        <input id="image-input" type="file" accept="image/*" hidden />
      </label>

      <img id="image-preview" class="image-preview hidden" alt="Превью" />

      <input id="title-input" type="text" class="text-input" placeholder="Название песни" />
      <input id="artist-input" type="text" class="text-input" placeholder="Исполнитель (необязательно)" />

      <textarea id="lyrics-input" class="text-input lyrics-textarea" placeholder="Текст песни (можно с таймкодами [00:12] Строчка...)"></textarea>

      <div class="modal-actions">
        <button id="cancel-modal-btn" class="modal-btn secondary">Отмена</button>
        <button id="save-track-btn" class="modal-btn primary">Добавить</button>
      </div>
    </div>
  </div>

  <audio id="audio" playsinline></audio>
  <script src="app.js"></script>
</body>
</html>
